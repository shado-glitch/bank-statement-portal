<!DOCTYPE html>
<html xmlns:layout = "http://wwww.ultraq.net.nz/thymeleaf/layout"
      xmlns th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">The Black Bank</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <h1>The Black bank statement portal</h1>
        <p th:if="${user}" th:text="'Welcome' + ${user.name}"></p>
        <p this:unless="${user}"> Welcome please sign in</p>

    </header>
    <main layout:fragment=""content></main>
    <footer></footer>
    
</body>
</html>
